simulation:
  num_patients: 1
  num_sessions: 3
  num_turns: 5
  seed: 60
  max_validation_retries: 2
  temperature: 0.7
  pipeline: full
  n_items: 3
  node_prob: 0.7
  edge_prob: 0.5
  # pipeline options:
  #   full                      - all steps
  #   no_validation             - skip both validation steps
  #   vignette_only             - craft_persona + vignette + validate_vignette + analyse_vignette
  #   no_analysis               - skip analysis step
  #   no_validation_no_analysis - skip validation and analysis
  #   full_memory               - full + cross-session interviewer memory (knowledge graph)

models:
  persona_crafter: gpt-4o-mini
  validator: gpt-4o-mini
  dialogue_state: gpt-4o-mini
  client: gpt-4o-mini
  interviewer: gpt-4o-mini
  analyst: gpt-4o-mini
  vignette_analyst: gpt-4o-mini

agents:
  interviewer: InterviewerAgent
  client: ClientAgent
  analyst: ConversationAnalystAgent
  vignette_analyst: VignetteAnalystAgent
